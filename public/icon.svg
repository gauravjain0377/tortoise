<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131d"/>
      <stop offset="100%" stop-color="#06080b"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#83eda8"/>
      <stop offset="100%" stop-color="#2cc393"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2cc393"/>
      <stop offset="35%" stop-color="#83eda8"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#2cc393"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background tile with border -->
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="14" stroke="#83eda8" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Tortoise Shell Shield Outline -->
  <path d="M 32 11 C 43 11 50 18 50 28 C 50 38 42 46 32 50 C 22 46 14 38 14 28 C 14 18 21 11 32 11 Z" 
        stroke="url(#brandGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="rgba(131, 237, 168, 0.08)"/>

  <!-- Inner Shell Hexagon Segments -->
  <polygon points="32,17 40,22 40,31 32,36 24,31 24,22" 
           stroke="url(#brandGrad)" stroke-width="1.5" stroke-opacity="0.45" fill="none"/>

  <!-- Pulse Waveform Neon Core -->
  <path d="M 9 32 L 20 32 L 25 32 L 28 21 L 32 43 L 36 15 L 40 37 L 43 32 L 55 32" 
        stroke="#83eda8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" filter="url(#glow)"/>
  <path d="M 9 32 L 20 32 L 25 32 L 28 21 L 32 43 L 36 15 L 40 37 L 43 32 L 55 32" 
        stroke="url(#pulseGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Peak telemetry spark point -->
  <circle cx="36" cy="15" r="2.2" fill="#ffffff" filter="url(#glow)"/>
</svg>
